<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hex Converter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="outer_container">
        <h1>Hex Converter</h1>

        <div class="convertion_container">

        <input type="text" id="hexInput" placeholder="Enter hex number" />

        <button onclick="convertHex()">Convert</button>

        <div class="output">
            <p><strong>Decimal:</strong> <span id="decimalOutput">-</span></p>
            <p><strong>Binary:</strong> <span id="binaryOutput">-</span></p>
        </div>

        </div>
    </div>

    <script src="script.js"></script>





</body>

</html>
