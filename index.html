<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Hex Converter</title>
        <link rel="stylesheet" href="style.css">
    </head>
    
    <body>
        <div class="outer_container">
            <h1>Hex Converter</h1>
        
            <div class="conversion_container">
            
                <div class="input">
                    <textarea id="hexInput"
                              placeholder="Enter hex number"
                              onkeydown="if(event.key === 'Enter') convertHex()"></textarea>
                
                    <button onclick="convertHex()">Convert</button>
                </div>
            
                <div class="output">
                    <label>Decimal (<span id="decimalCount">0</span> digits)</label>
                    <textarea id="decimalOutput" readonly></textarea>
                
                    
                    <label>Binary (<span id="binaryCount">0</span> digits)</label>
                    <textarea id="binaryOutput" readonly></textarea>
                </div>
            
            </div>
        </div>
    
        <script src="script.js"></script>
    </body>
</html>
